<svg xmlns="http://www.w3.org/2000/svg" width="112" height="112" viewBox="0 0 112 112" role="img" aria-labelledby="hidden-title hidden-desc">
  <title id="hidden-title">绝壑回身 · 隐藏徽章</title>
  <desc id="hidden-desc">流动虹彩的星芒、旋转光环与夜蓝宝石构成隐藏成就徽章，底部刻着绝壑回身。</desc>
  <defs>
    <radialGradient id="hidden-aura">
      <stop stop-color="#fffdf3" stop-opacity=".97"/>
      <stop offset=".48" stop-color="#f1b9ff" stop-opacity=".5"/>
      <stop offset="1" stop-color="#7cf6ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hidden-prism" x1="0" y1="0" x2="112" y2="112" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff6a7"><animate attributeName="stop-color" values="#fff6a7;#92fff5;#e1a9ff;#fff6a7" dur="7s" repeatCount="indefinite"/></stop>
      <stop offset=".31" stop-color="#fd80d6"><animate attributeName="stop-color" values="#fd80d6;#ffdc82;#80e8ff;#fd80d6" dur="7s" repeatCount="indefinite"/></stop>
      <stop offset=".67" stop-color="#82eeff"><animate attributeName="stop-color" values="#82eeff;#d994ff;#ffb2d0;#82eeff" dur="7s" repeatCount="indefinite"/></stop>
      <stop offset="1" stop-color="#c2a0ff"><animate attributeName="stop-color" values="#c2a0ff;#8fffc7;#ffe087;#c2a0ff" dur="7s" repeatCount="indefinite"/></stop>
      <animateTransform attributeName="gradientTransform" type="rotate" from="0 56 56" to="360 56 56" dur="18s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="hidden-gem" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fffdf7"/><stop offset=".26" stop-color="#9cf8ff"/><stop offset=".6" stop-color="#c89bff"/><stop offset="1" stop-color="#ff9bcc"/>
    </linearGradient>
    <linearGradient id="hidden-face" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#26346f"/><stop offset=".54" stop-color="#101f50"/><stop offset="1" stop-color="#171239"/>
    </linearGradient>
    <linearGradient id="hidden-plaque" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#263777"/><stop offset=".55" stop-color="#351c63"/><stop offset="1" stop-color="#132350"/>
    </linearGradient>
  </defs>
  <!-- Static prismatic facets remain rich even in viewers that do not animate SVG. -->
  <circle cx="56" cy="48" r="56" fill="url(#hidden-aura)"/>
  <path d="M56 1 64 15 76 5 78 22 96 17 92 34 109 40 99 53 111 65 94 71 100 87 82 84 79 103 65 94 56 111 47 94 33 103 30 84 12 87 18 71 1 65 13 53 3 40 20 34 16 17 34 22 36 5 48 15Z" fill="url(#hidden-prism)" stroke="#fffcef" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M56 8 65 20 77 13 80 28 96 28 89 42 104 50 90 59 99 72 82 73 82 90 66 84 56 101 46 84 30 90 30 73 13 72 22 59 8 50 23 42 16 28 32 28 35 13 47 20Z" fill="#17234f" stroke="url(#hidden-prism)" stroke-width="2.2" stroke-linejoin="round"/>
  <g fill="none" stroke="url(#hidden-prism)" stroke-width="2.5" opacity=".9">
    <circle cx="56" cy="48" r="40" stroke-dasharray="34 8 5 9 20 8">
      <animateTransform attributeName="transform" type="rotate" from="0 56 48" to="360 56 48" dur="16s" repeatCount="indefinite"/>
    </circle>
    <circle cx="56" cy="48" r="34" stroke-width="1.1" stroke-dasharray="3 8">
      <animateTransform attributeName="transform" type="rotate" from="360 56 48" to="0 56 48" dur="13s" repeatCount="indefinite"/>
    </circle>
  </g>
  <path d="M56 18 82 30 79 64Q76 79 56 94 36 79 33 64L30 30Z" fill="#091637" stroke="url(#hidden-prism)" stroke-width="4.3" stroke-linejoin="round"/>
  <path d="M56 23 76 33 73 62Q71 75 56 87 41 75 39 62L36 33Z" fill="url(#hidden-face)" stroke="#f7f0ff" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M56 27 68 43 78 48 66 56 56 79 46 56 34 48 44 43Z" fill="url(#hidden-gem)" stroke="#fffefa" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M56 27v52M34 48h44M44 43l12 14 12-14M46 56l10 1 10-1" fill="none" stroke="#fffdf6" stroke-width="1.5" stroke-linecap="round" opacity=".9"/>
  <path d="m56 36 4 11 11 1-11 3-4 11-4-11-11-3 11-1Z" fill="#fffef5" opacity=".93">
    <animate attributeName="opacity" values=".66;1;.66" dur="2.6s" repeatCount="indefinite"/>
  </path>
  <g fill="#fffdf1" stroke="#fffdf1" stroke-width=".7">
    <path d="m16 15 2 6 6 2-6 2-2 6-2-6-6-2 6-2ZM96 14l2 6 6 2-6 2-2 6-2-6-6-2 6-2Z"/>
    <path d="m10 63 1.3 3.7L15 68l-3.7 1.3L10 73l-1.3-3.7L5 68l3.7-1.3ZM102 63l1.3 3.7L107 68l-3.7 1.3L102 73l-1.3-3.7L98 68l3.7-1.3Z"/>
    <animate attributeName="opacity" values="1;.38;1" dur="3.1s" repeatCount="indefinite"/>
  </g>
  <!-- Keep the inscription still and high contrast while the colors orbit it. -->
  <path d="M13 84 26 79h60l13 5-6 22H19Z" fill="#0c173a" stroke="url(#hidden-prism)" stroke-width="3" stroke-linejoin="round"/>
  <path d="M18 86 27 83h58l9 3-4 16H22Z" fill="url(#hidden-plaque)" stroke="#fff9db" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M27 86h58" stroke="url(#hidden-prism)" stroke-width="1.4"/>
  <text id="achievement-name" x="56" y="97" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="12.5" font-weight="900" letter-spacing="1" fill="#fffdf5" stroke="#151b49" stroke-width=".7" paint-order="stroke fill">绝壑回身</text>
</svg>
