<svg xmlns="http://www.w3.org/2000/svg" width="112" height="112" viewBox="0 0 112 112" role="img" aria-labelledby="silver-title silver-desc">
  <title id="silver-title">雄踞长空 · 银徽章</title>
  <desc id="silver-desc">双层银翼环绕锋刃战盾，冠上嵌着冰蓝宝石，底部铭牌写着雄踞长空。</desc>
  <defs>
    <linearGradient id="silver-wing" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffffff"/><stop offset=".22" stop-color="#c9e0e5"/><stop offset=".55" stop-color="#698694"/><stop offset="1" stop-color="#e8f9fb"/>
    </linearGradient>
    <linearGradient id="silver-frame" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffffff"/><stop offset=".22" stop-color="#d8edf0"/><stop offset=".61" stop-color="#74909e"/><stop offset="1" stop-color="#f2ffff"/>
    </linearGradient>
    <linearGradient id="silver-face" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#648599"/><stop offset=".45" stop-color="#314f66"/><stop offset="1" stop-color="#1f354a"/>
    </linearGradient>
    <linearGradient id="silver-blade" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffffff"/><stop offset=".44" stop-color="#d6faff"/><stop offset="1" stop-color="#69a8ba"/>
    </linearGradient>
    <linearGradient id="silver-plaque" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#e5f7f8"/><stop offset=".38" stop-color="#8caeb9"/><stop offset="1" stop-color="#3e6275"/>
    </linearGradient>
  </defs>
  <!-- Two tiers of forged wing blades distinguish silver from bronze. -->
  <g fill="url(#silver-wing)" stroke="#3c6171" stroke-width="1.8" stroke-linejoin="round">
    <path d="M37 32 18 13 3 16 19 32 3 32 20 44 5 49 25 55 13 61 37 59 44 41Z"/>
    <path d="M75 32 94 13 109 16 93 32 109 32 92 44 107 49 87 55 99 61 75 59 68 41Z"/>
  </g>
  <g fill="none" stroke="#f6ffff" stroke-width="1.5" stroke-linecap="round">
    <path d="M9 19 33 39M10 35l26 11M12 51l24 2M17 59l20-4"/>
    <path d="m103 19-24 20m23-4L76 46m24 5-24 2m19 6-20-4"/>
  </g>
  <path d="M37 28 34 9l15 10 7-17 7 17L78 9l-3 19-19 8Z" fill="#39596a" stroke="#223c4d" stroke-width="2" stroke-linejoin="round"/>
  <path d="M39 25 37 13l12 10 7-17 7 17 12-10-2 12-17 7Z" fill="url(#silver-frame)" stroke="#f4ffff" stroke-width="1.3" stroke-linejoin="round"/>
  <path d="m56 14 4 6-4 6-4-6Z" fill="#78deeb" stroke="#f3ffff" stroke-width="1"/>
  <!-- Deep cobalt field and polished bevel give the crest visible depth. -->
  <path d="M56 18 86 31 82 68Q79 86 56 102 33 86 30 68L26 31Z" fill="#2c4b5d" stroke="#1b3343" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M56 23 80 33 77 67Q74 81 56 94 38 81 35 67L32 33Z" fill="url(#silver-frame)" stroke="#f5ffff" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M56 29 74 38 71 65Q69 76 56 86 43 76 41 65L38 38Z" fill="url(#silver-face)" stroke="#23465c" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M38 35 56 27 74 35" fill="none" stroke="#ffffff" stroke-width="1.3" stroke-linecap="round"/>
  <!-- A single ascending spear sits between two angular guard blades. -->
  <path d="M41 51 47 42 53 50 48 63 39 59ZM71 51 65 42 59 50l5 13 9-4Z" fill="#9dcdd7" stroke="#e8ffff" stroke-width="1.3" stroke-linejoin="round"/>
  <path d="m56 32 9 20-5-3v20l-4 8-4-8V49l-5 3Z" fill="url(#silver-blade)" stroke="#2f5c72" stroke-width="2" stroke-linejoin="round"/>
  <path d="M56 40v28" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
  <path d="m44 67 12 13 12-13" fill="none" stroke="#bee9ec" stroke-width="2" stroke-linejoin="round"/>
  <path d="m36 47 2.5 4 4 2.5-4 2.5-2.5 4-2.5-4-4-2.5 4-2.5ZM76 47l2.5 4 4 2.5-4 2.5-2.5 4-2.5-4-4-2.5 4-2.5Z" fill="#e9fdff"/>
  <path d="M16 84 27 79h58l11 5-5 19H21Z" fill="#29495a" stroke="#1c3343" stroke-width="2" stroke-linejoin="round"/>
  <path d="M20 86 28 82h56l8 4-3 14H23Z" fill="url(#silver-plaque)" stroke="#f2ffff" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M28 85h56" stroke="#ffffff" stroke-width="1"/>
  <text id="achievement-name" x="56" y="97" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="12.5" font-weight="900" letter-spacing="1" fill="#ffffff" stroke="#234456" stroke-width=".5" paint-order="stroke fill">雄踞长空</text>
</svg>
